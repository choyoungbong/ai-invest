version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aiinvest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiinvest
      POSTGRES_PASSWORD: aiinvest
      POSTGRES_DB: aiinvest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinvest"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aiinvest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiinvest-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://aiinvest:aiinvest@postgres:5432/aiinvest
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_MOCK: ${KIS_MOCK:-true}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:--0.02}
      TARGET_PROFIT_PCT: ${TARGET_PROFIT_PCT:-0.03}
      TOTAL_BUDGET: ${TOTAL_BUDGET:-5000000}
      ALLOC_BREAKOUT: ${ALLOC_BREAKOUT:-0.40}
      ALLOC_MA_CROSS: ${ALLOC_MA_CROSS:-0.30}
      ALLOC_RSI_REVERSAL: ${ALLOC_RSI_REVERSAL:-0.20}
      ALLOC_MACD: ${ALLOC_MACD:-0.10}
      MAX_SINGLE_TRADE_PCT: ${MAX_SINGLE_TRADE_PCT:-0.20}
      AUTO_TRADE_ENABLED: ${AUTO_TRADE_ENABLED:-true}
      MAX_AMOUNT_PER_STOCK: ${MAX_AMOUNT_PER_STOCK:-300000}
      # ── 분할매수 ──────────────────────────────────────────
      SPLIT_BUY_ENABLED: ${SPLIT_BUY_ENABLED:-true}
      SPLIT_BUY_RATIO: ${SPLIT_BUY_RATIO:-0.6}
      SPLIT_BUY_TRIGGER_PCT: ${SPLIT_BUY_TRIGGER_PCT:-0.003}
      SPLIT_BUY_MIN_MINUTES: ${SPLIT_BUY_MIN_MINUTES:-5}
      SPLIT_BUY_MAX_MINUTES: ${SPLIT_BUY_MAX_MINUTES:-30}
      MAX_PHASE2_RISE_PCT: ${MAX_PHASE2_RISE_PCT:-0.03}
      # ── 리스크 관리 ────────────────────────────────────────
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      HARD_STOP_PCT: ${HARD_STOP_PCT:--0.03}
      BLACKLIST_DAYS: ${BLACKLIST_DAYS:-3}
      DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-30000}
      MAX_POSITIONS: ${MAX_POSITIONS:-5}

      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.55}
      RSI_MIN: ${RSI_MIN:-45}
      RSI_MAX: ${RSI_MAX:-78}
      FILTER_RSI_ENABLED: ${FILTER_RSI_ENABLED:-true}
      FILTER_MACD_ENABLED: ${FILTER_MACD_ENABLED:-true}
      FILTER_MA_ENABLED: ${FILTER_MA_ENABLED:-true}
      FILTER_BB_ENABLED: ${FILTER_BB_ENABLED:-true}
      MIN_CHANGE_RATE: ${MIN_CHANGE_RATE:-2.0}
      BREAKOUT_DAYS: ${BREAKOUT_DAYS:-20}
      VOLUME_MULTIPLIER: ${VOLUME_MULTIPLIER:-2.0}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Dashboard ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://34.64.253.182:8000
    container_name: aiinvest-dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://34.64.253.182:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
